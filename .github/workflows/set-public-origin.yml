name: Set public origin

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Public HTTPS origin (no trailing slash)
        required: true
      host:
        description: VPS host to configure
        required: false
        default: 3.37.14.63

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate origin
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          [[ "$ORIGIN" =~ ^https://[A-Za-z0-9._:-]+$ ]]

      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/issam_bot_deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/issam_bot_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Update secret.env and recreate app containers
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          host="${ORIGIN#https://}"
          # The host is an input: this was pinned to the old US box and silently
          # configured a machine we no longer run.
          ssh_args=(-i ~/.ssh/issam_bot_deploy -o BatchMode=yes "deploy@${{ inputs.host }}")
          ssh "${ssh_args[@]}" \
            "sudo -n sed -i \
              -e 's|^WEB_ORIGIN=.*|WEB_ORIGIN=${ORIGIN}|' \
              -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=${ORIGIN}|' \
              -e 's|^API_URL=.*|API_URL=${ORIGIN}|' \
              -e 's|^RAKAZO_HOST=.*|RAKAZO_HOST=${host}|' \
              /opt/issam-bot/secret.env"
          ssh "${ssh_args[@]}" \
            'cd /opt/issam-bot && sudo -n docker compose --env-file /opt/issam-bot/secret.env -f docker-compose.yml up -d --remove-orphans'
