name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR image tag
        required: true
        default: sha-840385d
      git_sha:
        description: Full Git revision reported by /health
        required: true
        default: 840385d222f7fa8b25dc6bf990d1e5d7d6a93ef1
      host:
        description: Target VPS address
        required: true
        default: 172.245.30.225

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable revision
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/issam_bot_deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/issam_bot_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and start immutable image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          ssh_args=(-i ~/.ssh/issam_bot_deploy -o BatchMode=yes "deploy@${{ inputs.host }}")
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_args[@]}" \
            'sudo -n docker login ghcr.io -u veryhungryface --password-stdin'
          ssh "${ssh_args[@]}" \
            "cd /opt/issam-bot && sudo -n env ISSAM_BOT_IMAGE=ghcr.io/veryhungryface/issam-bot:${IMAGE_TAG} GIT_SHA=${GIT_SHA} docker compose --env-file /opt/issam-bot/secret.env -f docker-compose.yml pull && if ! sudo -n env ISSAM_BOT_IMAGE=ghcr.io/veryhungryface/issam-bot:${IMAGE_TAG} GIT_SHA=${GIT_SHA} docker compose --env-file /opt/issam-bot/secret.env -f docker-compose.yml up -d --remove-orphans; then sudo -n docker compose --env-file /opt/issam-bot/secret.env -f docker-compose.yml up -d --remove-orphans; exit 1; fi"

      - name: Verify exact revision and persist release
        if: always()
        run: |
          ssh_args=(-i ~/.ssh/issam_bot_deploy -o BatchMode=yes "deploy@${{ inputs.host }}")
          ssh "${ssh_args[@]}" 'sudo -n docker logout ghcr.io >/dev/null 2>&1 || true' || true
          if [[ "${{ job.status }}" == "success" ]]; then
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --max-time 10 "http://${{ inputs.host }}/health" | grep -Fq '"revision":"${{ inputs.git_sha }}"'; then
                ssh "${ssh_args[@]}" \
                  "sudo -n sed -i 's|^ISSAM_BOT_IMAGE=.*|ISSAM_BOT_IMAGE=ghcr.io/veryhungryface/issam-bot:${{ inputs.image_tag }}|' /opt/issam-bot/secret.env && sudo -n sed -i 's|^GIT_SHA=.*|GIT_SHA=${{ inputs.git_sha }}|' /opt/issam-bot/secret.env"
                exit 0
              fi
              sleep 5
            done
            ssh "${ssh_args[@]}" \
              'cd /opt/issam-bot && sudo -n docker compose --env-file /opt/issam-bot/secret.env -f docker-compose.yml up -d --remove-orphans' || \
              printf '%s\n' '::error::Exact-revision health failed and the previous Compose release could not be restored.' >&2
            exit 1
          fi

      - name: Prune unused images after verified deployment
        if: success()
        run: |
          ssh_args=(-i ~/.ssh/issam_bot_deploy -o BatchMode=yes "deploy@${{ inputs.host }}")
          ssh "${ssh_args[@]}" '
            set -eu
            printf "%s\n" "Docker filesystem before unused-image cleanup:"
            df -hP /
            printf "%s\n" "Docker image usage before cleanup:"
            sudo -n docker system df
            sudo -n docker image prune -a -f
            printf "%s\n" "Docker filesystem after unused-image cleanup:"
            df -hP /
            printf "%s\n" "Docker image usage after cleanup:"
            sudo -n docker system df
          '
